worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    access_log /dev/stdout;
    client_body_temp_path /tmp/nginx-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # entrypoint 生成，形如：
    #   map $uri $is_node { default 0; /fe82f69e 1; }
    include /tmp/node-path.conf;

    upstream xray_backend { server 127.0.0.1:10000; }

    server {
        listen 8080;
        server_name _;
        root /app/site;
        index index.html;

        # 节点路径：走 Xray（WebSocket）
        # 用 rewrite ... last 实现"条件 location"
        location / {
            if ($is_node = 1) {
                rewrite ^ /__node last;
            }
            try_files $uri $uri/ /index.html;
        }

        location = /__node {
            internal;
            proxy_pass http://xray_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }
    }
}
