worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    access_log /dev/stdout;
    client_body_temp_path /tmp/nginx-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # entrypoint 生成：
    #   map $uri $upstream { default "static"; /fe82f69e "http://127.0.0.1:10000"; }
    include /tmp/node-path.conf;

    server {
        listen 8080;
        server_name _;
        root /app/site;
        index index.html;

        # $upstream 为 "static" 时走文件，否则 proxy_pass 到该地址
        # proxy_pass 使用变量时 nginx 不会改写 URI，原始 /fe82f69e 会原样转发给 Xray
        location / {
            proxy_pass $upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;

            error_page 418 = @static;
            if ($upstream = "static") {
                return 418;
            }
        }

        location @static {
            try_files $uri $uri/ /index.html;
        }
    }
}
