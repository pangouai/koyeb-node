<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>服务状态</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1720;color:#c8d6e5;font:15px/1.7 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
     min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.box{max-width:520px;width:100%;background:#16222e;border:1px solid #22303d;border-radius:10px;padding:38px 34px}
h1{font-size:19px;font-weight:600;color:#e8f1f8;margin-bottom:8px}
.sub{font-size:13px;color:#5f7488;margin-bottom:26px}
.row{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid #1e2c38;font-size:14px}
.row:last-of-type{border:none}
.k{color:#6b8098}
.v{color:#7fd1a8;font-weight:500}
.note{margin-top:24px;font-size:12.5px;color:#4d6070;line-height:1.8}
</style>
</head>
<body>
<div class="box">
  <h1>服务状态</h1>
  <div class="sub">边缘节点 · 法兰克福</div>
  <div class="row"><span class="k">运行状态</span><span class="v">正常</span></div>
  <div class="row"><span class="k">接入协议</span><span class="v">HTTPS / WebSocket</span></div>
  <div class="row"><span class="k">区域</span><span class="v">fra</span></div>
  <div class="row"><span class="k">版本</span><span class="v">1.0.0</span></div>
  <div class="note">本节点仅提供接入服务。如需配置客户端，请使用管理员提供的连接信息。</div>
</div>
</body>
</html>
