[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

; ---------- 1. 渲染配置（一次性）----------
[program:render]
command=/bin/sh /entrypoint-relay.sh
autostart=true
autorestart=false
startsecs=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=5

; ---------- 2. OpenList（伪装站，内部 5244）----------
[program:openlist]
command=/opt/openlist/openlist server --config /tmp/config.json
directory=/opt/openlist
user=openlist
autostart=true
autorestart=true
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10

; ---------- 3. Xray（VLESS-WS，内部 10000）----------
[program:xray]
command=/opt/xray/xray run -c /opt/xray/config.json
directory=/opt/xray
autostart=true
autorestart=true
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20

; ---------- 4. nginx（对外 8080，按路径分流）----------
[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=30
