[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

; ---------- OpenList（伪装站 / 网盘，HTTP 5244）----------
[program:openlist]
command=/opt/openlist/openlist server --config /tmp/config.json
directory=/opt/openlist
user=openlist
autostart=true
autorestart=true
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10

; ---------- relay（TCP 落地，8443）----------
; HTTP_PORT=0 关掉内置静态站，伪装交给 OpenList
[program:relay]
command=node /app/relay.js
directory=/app
autostart=true
autorestart=true
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20
environment=PORT="8443",HTTP_PORT="0"
